<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Base64 加解密微服务</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; }
        textarea { width: 100%; height: 200px; margin: 10px 0 0 0; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 24px; margin-right: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        h2 { margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <h2>Base64 加解密工具</h2>
    <label>输入内容：</label>
    <textarea id="inputText" placeholder="输入要加密或解密的文字..."></textarea>

    <div style="margin: 2rem 0 2rem 0">
        <button onclick="encodeText()">加密</button>
        <button onclick="decodeText()">解密</button>
    </div>

    <label>输出结果：</label>
    <textarea id="outputText" readonly placeholder="结果将显示在这里..."></textarea>
</div>

<script>
    async function encodeText() {
        const text = document.getElementById('inputText').value;
        if (!text) return alert("请输入内容");
        const res = await fetch(`/api/encode?text=${encodeURIComponent(text)}`, { method: 'POST' });
        document.getElementById('outputText').value = await res.text();
    }

    async function decodeText() {
        const text = document.getElementById('inputText').value;
        if (!text) return alert("请输入内容");
        const res = await fetch(`/api/decode?text=${encodeURIComponent(text)}`, { method: 'POST' });
        document.getElementById('outputText').value = await res.text();
    }
</script>
</body>
</html>
